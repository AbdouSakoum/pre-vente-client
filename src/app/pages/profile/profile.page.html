<ion-header class="ion-no-border">
  <ion-toolbar class="st-toolbar">
    <div class="st-head">
      <div class="st-head__text"><span class="st-title big">{{ 'profile.title' | translate }}</span></div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page">
    <section class="card account">
      <ion-icon name="storefront-outline"></ion-icon>
      <strong>{{ auth.account()?.name }}</strong>
      <span class="account__meta" *ngIf="auth.account()?.category as cat">
        {{ 'category.' + cat | translate }}<ng-container *ngIf="auth.account()?.city as city"> · {{ city }}</ng-container>
      </span>
      <span dir="ltr">{{ identifier }}</span>
    </section>

    <section class="card row">
      <span>{{ 'profile.language' | translate }}</span>
      <app-lang-switch></app-lang-switch>
    </section>

    <button type="button" class="card row link" routerLink="/my-code">
      <span><ion-icon name="qr-code-outline"></ion-icon> {{ 'suppliers.showMyCode' | translate }}</span>
      <ion-icon name="chevron-forward"></ion-icon>
    </button>

    <button type="button" class="btn btn--danger" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon> {{ 'profile.logout' | translate }}
    </button>

    <button type="button" class="delete-link" (click)="askDelete()">{{ 'profile.deleteAccount' | translate }}</button>

    <p class="version">{{ brand.appName }} · {{ version }}</p>
  </div>

  <!-- SUPPRESSION DU COMPTE : mot de passe redemandé -->
  <div class="sheet" *ngIf="deleting" (click)="cancelDelete()">
    <div class="sheet__panel st-sheet" (click)="$event.stopPropagation()">
      <div class="st-handle"></div>
      <h2 class="st-sheet__title">{{ 'profile.deleteTitle' | translate }}</h2>
      <p class="st-sheet__sub">{{ 'profile.deleteText' | translate }}</p>
      <label class="field">
        <span class="field__label">{{ 'profile.deletePassword' | translate }}</span>
        <span class="field__box">
          <input #pwd type="password" autocomplete="current-password" [value]="password" (input)="password = pwd.value"
                 [placeholder]="'profile.deletePasswordHint' | translate" />
        </span>
      </label>
      <p class="sheet__error" *ngIf="errorMsg">{{ errorMsg }}</p>
      <button type="button" class="st-btn danger" [disabled]="busy || !password" (click)="confirmDelete()">
        {{ (busy ? 'common.loading' : 'profile.deleteConfirm') | translate }}
      </button>
      <button type="button" class="st-btn st-btn--text" [disabled]="busy" (click)="cancelDelete()">{{ 'common.cancel' | translate }}</button>
    </div>
  </div>
</ion-content>
