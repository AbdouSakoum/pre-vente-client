<ion-content>
  <!-- ÉTAPE 1 : IDENTIFIANT -->
  <form class="auth" *ngIf="step === 'identifier'" (ngSubmit)="request()" novalidate>
    <img class="auth__logo" [src]="brand.logo" [alt]="brand.appName" />
    <h1 class="auth__title">{{ 'auth.forgot.title' | translate }}</h1>
    <p class="auth__sub">{{ 'auth.forgot.sub' | translate }}</p>

    <div class="alert" *ngIf="errorMsg"><ion-icon name="alert-circle-outline"></ion-icon><span>{{ errorMsg }}</span></div>

    <label class="field">
      <span class="field__label">{{ 'auth.identifier' | translate }}</span>
      <span class="field__box">
        <input type="text" name="identifier" [(ngModel)]="identifier" dir="ltr" inputmode="email"
               autocomplete="username" autocapitalize="off" spellcheck="false"
               [placeholder]="'auth.identifierPlaceholder' | translate" />
      </span>
    </label>

    <button type="submit" class="btn btn--primary" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      {{ (loading ? 'common.loading' : 'auth.forgot.continue') | translate }}
    </button>
    <p class="auth__links"><a routerLink="/login">{{ 'auth.forgot.backToLogin' | translate }}</a></p>
  </form>

  <!-- ÉTAPE 2 : CODE ET NOUVEAU MOT DE PASSE -->
  <form class="auth" *ngIf="step === 'code'" (ngSubmit)="reset()" novalidate>
    <img class="auth__logo" [src]="brand.logo" [alt]="brand.appName" />
    <h1 class="auth__title">{{ 'auth.forgot.codeTitle' | translate }}</h1>

    <div class="alert alert--info">
      <ion-icon [name]="channel === 'email' ? 'mail-outline' : 'storefront-outline'"></ion-icon>
      <span>{{ (channel === 'email' ? 'auth.forgot.byEmail' : 'auth.forgot.bySupplier') | translate }}</span>
    </div>
    <div class="alert" *ngIf="errorMsg"><ion-icon name="alert-circle-outline"></ion-icon><span>{{ errorMsg }}</span></div>

    <label class="field">
      <span class="field__label">{{ 'auth.forgot.code' | translate }}</span>
      <span class="field__box">
        <input class="code" type="text" name="code" [(ngModel)]="code" dir="ltr" inputmode="numeric" maxlength="6"
               autocomplete="one-time-code" placeholder="000000" />
      </span>
    </label>

    <label class="field">
      <span class="field__label">{{ 'auth.forgot.newPassword' | translate }}</span>
      <span class="field__box">
        <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" dir="ltr"
               autocomplete="new-password" />
        <button type="button" (click)="showPassword = !showPassword" [attr.aria-label]="'auth.showPassword' | translate">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </span>
      <span class="field__hint">{{ 'auth.passwordHint' | translate:{ n: 6 } }}</span>
    </label>

    <button type="submit" class="btn btn--primary" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      {{ (loading ? 'common.loading' : 'auth.forgot.submit') | translate }}
    </button>
    <button type="button" class="btn btn--ghost" [disabled]="loading" (click)="back()">{{ 'common.back' | translate }}</button>
  </form>
</ion-content>
